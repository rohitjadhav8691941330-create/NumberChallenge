
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            python3-pip python3-venv \
            build-essential autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev

    
      - name: Set up Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/python -m pip install "Cython==0.29.36" buildozer
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          command -v cython
          cython --version
          .venv/bin/buildozer --version

         - name: Build APK
        env:
          P4A_NO_INSTALL: "1"
        run: |
          .venv/bin/buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NumberChallenge-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
